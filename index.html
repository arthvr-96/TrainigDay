<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <title>Тренировки</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230A84FF'/%3E%3Cpath d='M28 40v20M72 40v20M20 46v8M80 46v8M28 50h44' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>

  <main id="app"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Навигация">
    <button class="tab" data-a="view" data-v="dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/></svg>
      <span>Главная</span>
    </button>
    <button class="tab" data-a="view" data-v="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></svg>
      <span>Чек-лист</span>
    </button>
    <button class="tab" data-a="view" data-v="plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>План</span>
    </button>
  </nav>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="importFile" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
